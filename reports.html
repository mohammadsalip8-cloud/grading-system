<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>YBVC • Reports Pro</title><script src="https://cdn.tailwindcss.com"></script><style>.glass{background:linear-gradient(135deg,rgba(255,255,255,.08),rgba(255,255,255,.02));backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.08)}.card-hover{transition:all .3s}.card-hover:hover{transform:translateY(-4px);box-shadow:0 20px 40px rgba(0,0,0,.4)}</style></head>
<body class="bg-[#060815] text-white flex min-h-screen">
<aside class="w-[300px] bg-[#0a0d1f]/80 backdrop-blur-xl border-r border-white/[0.06] p-7 flex flex-col fixed h-screen">
<div class="flex items-center gap-3.5"><img src="img/yllanna logo.png" class="w-[56px] h-[56px] rounded-2xl bg-white p-1 object-cover"><div><h2 class="font-black text-[17px]">YBVC</h2><p class="text-[10px] text-white/40">College of Computer</p></div></div>
<nav class="space-y-2 mt-12">
<a href="index.html" class="flex gap-3 text-white/50 px-4 py-3.5 rounded-2xl hover:bg-white/[0.06]">📊 Dashboard</a>
<a href="students.html" class="flex gap-3 text-white/50 px-4 py-3.5 rounded-2xl hover:bg-white/[0.06]">👥 Students</a>
<a href="grades.html" class="flex gap-3 text-white/50 px-4 py-3.5 rounded-2xl hover:bg-white/[0.06]">📝 Grades</a>
<a href="reports.html" class="flex gap-3 bg-gradient-to-r from-[#2a5bda] to-[#3b6ef5] text-white px-4 py-3.5 rounded-2xl font-bold shadow-lg">📄 Reports</a>
<a href="settings.html" class="flex gap-3 text-white/50 px-4 py-3.5 rounded-2xl hover:bg-white/[0.06]">⚙️ Settings</a>
</nav>
<div class="mt-auto glass p-4 rounded-[20px] flex items-center gap-3 border-yellow-400/20">
<img src="img/admin.jpg" onerror="this.src='img/yllanna logo.png'" alt="Mohammad Salip" class="w-11 h-11 rounded-2xl object-cover border-2 border-yellow-400/50 shadow-lg">
<div><p class="text-[13px] font-bold">Mohammad Salip</p><p class="text-[10px] text-white/40">Super Admin • Online</p></div>
<div class="ml-auto w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
</div>
</aside>
<main class="flex-1 ml-[300px] p-10"><h1 class="text-[34px] font-black">Reports Center</h1><p class="text-white/40 text-[13px] mt-1">Export official DepEd documents</p>
<div class="grid grid-cols-3 gap-6 mt-10">
<div class="glass p-8 rounded-[28px] card-hover"><div class="w-14 h-14 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-2xl flex items-center justify-center text-2xl">📄</div><h3 class="font-bold text-[18px] mt-5">Report Card</h3><p class="text-white/40 text-[12px] mt-2">Form 138 • Per student</p><button id="reportCardBtn" class="bg-white text-black w-full mt-6 py-3 rounded-2xl font-bold text-[13px]">Generate PDF</button></div>
<div class="glass p-8 rounded-[28px] card-hover"><div class="w-14 h-14 bg-gradient-to-br from-green-500 to-emerald-600 rounded-2xl flex items-center justify-center text-2xl">📊</div><h3 class="font-bold text-[18px] mt-5">Class Record</h3><p class="text-white/40 text-[12px] mt-2">Excel • All students</p><button id="classRecordBtn" class="glass w-full mt-6 py-3 rounded-2xl font-bold text-[13px]">Export Excel</button></div>
<div class="glass p-8 rounded-[28px] card-hover border-yellow-400/20"><div class="w-14 h-14 bg-gradient-to-br from-yellow-400 to-orange-500 rounded-2xl flex items-center justify-center text-2xl">📑</div><h3 class="font-bold text-[18px] mt-5">Form 137</h3><p class="text-white/40 text-[12px] mt-2">Permanent Record • Official</p><button id="form137Btn" class="bg-gradient-to-r from-yellow-400 to-orange-500 text-black w-full mt-6 py-3 rounded-2xl font-bold text-[13px]">Export Official PDF</button></div>
</div></main>

<script>
document.getElementById('reportCardBtn').addEventListener('click', function(){
  const btn=this; btn.textContent='⏳ Generating...';
  const content=`YBVC - REPORT CARD (Form 138)\nStudent: Cruz, Angela M.\nFinal: 89 PASSED\nSchool: YBVC College\nAdmin: Mohammad Salip\nDate: ${new Date().toLocaleString()}`;
  setTimeout(()=>{
    const blob=new Blob([content],{type:'text/plain'}); const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download='ReportCard_Form138.txt'; a.click();
    btn.textContent='✓ Downloaded!'; setTimeout(()=>btn.textContent='Generate PDF',2000);
  },800);
});
document.getElementById('classRecordBtn').addEventListener('click', function(){
  const btn=this; btn.textContent='⏳ Exporting...';
  const csv=`LRN,Student,Course,Final,Status\n123456789012,"Cruz, Angela M.",BSIT-2A,89,PASSED\n123456789015,"Tan, John",BSCS-3B,66,FAILED\n`;
  setTimeout(()=>{
    const blob=new Blob([csv],{type:'text/csv'}); const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download='YBVC_ClassRecord.csv'; a.click();
    btn.textContent='✓ Excel Exported!'; setTimeout(()=>btn.textContent='Export Excel',2000);
  },800);
});
document.getElementById('form137Btn').addEventListener('click', function(){
  const btn=this; btn.textContent='⏳ Generating Official...';
  setTimeout(()=>{ alert('📑 Form 137 Generated!\n\nOfficial DepEd Document\nAdmin: Mohammad Salip\nReady for printing!'); btn.textContent='✓ Official PDF Ready!'; setTimeout(()=>btn.textContent='Export Official PDF',2000); },1000);
});
</script>
<style>@media(max-width:768px){aside{display:none !important} main{margin-left:0 !important; padding:20px !important} .grid-cols-3{grid-template-columns:1fr !important}} button{touch-action:manipulation; min-height:44px; cursor:pointer}</style>
</body></html>
