<a href="grades.html" class="flex items-center gap-3.5 text-white/50 hover:bg-white/[0.06] px-4 py-3.5 rounded-2xl text-[13px]"><span class="w-7 h-7 bg-white/[0.06] rounded-xl flex items-center justify-center">📝</span> Grades</a>
<a href="reports.html" class="flex items-center gap-3.5 text-white/50 hover:bg-white/[0.06] px-4 py-3.5 rounded-2xl text-[13px]"><span class="w-7 h-7 bg-white/[0.06] rounded-xl flex items-center justify-center">📄</span> Reports</a>
<a href="settings.html" class="flex items-center gap-3.5 text-white/50 hover:bg-white/[0.06] px-4 py-3.5 rounded-2xl text-[13px]"><span class="w-7 h-7 bg-white/[0.06] rounded-xl flex items-center justify-center">⚙️</span> Settings</a>
</nav>
<!-- ADMIN - AYOS NA - NA AY PICTURE NIMO -->
<div class="mt-auto glass p-4 rounded-[20px] flex items-center gap-3 border-yellow-400/20">
<img src="img/lip.jpg" onerror="this.src='img/yllanna logo.png'" alt="Mohammad Salip" class="w-11 h-11 rounded-2xl object-cover border-2 border-yellow-400/50 shadow-lg">
<div><p class="text-[13px] font-bold">Mohammad Salip</p><p class="text-[10px] text-white/40">Super Admin • Online</p></div>
<div class="ml-auto w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
</div>
</aside>
<main class="flex-1 ml-[300px] p-10"><div class="flex justify-between items-center"><div><h1 class="text-[34px] font-black tracking-tight">Students</h1><p class="text-white/40 text-[13px] mt-1">248 Active • 12 New this week</p></div><button class="bg-white text-black px-7 py-3.5 rounded-2xl font-bold text-[13px] shadow-xl hover:bg-yellow-400 transition">+ Add Student</button></div><div class="glass rounded-[28px] mt-8 p-8"><div class="flex gap-3 mb-6"><input placeholder="Search LRN, name, course..." class="glass px-6 py-3 rounded-2xl text-[13px] w-[380px] outline-none focus:border-blue-500"><select class="glass px-5 py-3 rounded-2xl text-[13px]"><option>All Courses</option><option>BSIT</option><option>BSCS</option></select></div><table class="w-full text-[13px]"><thead class="text-[10px] text-white/30 border-b border-white/[0.06]"><tr><th class="py-4 text-left">LRN</th><th class="text-left">NAME</th><th>COURSE</th><th>STATUS</th><th>ACTION</th></tr></thead><tbody class="divide-y divide-white/[0.04]"><tr class="hover:bg-white/[0.02]"><td class="py-5 text-white/60">123456789012</td><td class="font-semibold flex items-center gap-2"><div class="w-7 h-7 bg-gradient-to-br from-blue-500 to-purple-600 rounded-full flex items-center justify-center text-[9px] font-bold">AM</div> Cruz, Angela M.</td><td><span class="glass px-3 py-1 rounded-full text-[11px]">BSIT-2A</span></td><td><span class="bg-green-500/15 text-green-400 px-3 py-1 rounded-full text-[10px] border border-green-500/20">● Active</span></td><td><button class="text-blue-400 hover:text-white">Edit</button></td></tr></tbody></table></div></main>

<!-- ADD MODAL -->
<div id="addModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
  <div class="glass bg-[#0a0d1f] p-8 rounded-[28px] w-full max-w-[450px] border border-white/10">
    <h3 class="font-black text-[20px]" id="modalTitle">+ Add New Student</h3>
    <div class="mt-6 space-y-4">
      <input id="lrnInput" placeholder="LRN - 12 digits" class="w-full glass px-4 py-3 rounded-2xl text-[13px] outline-none">
      <input id="nameInput" placeholder="Full Name - Last, First M." class="w-full glass px-4 py-3 rounded-2xl text-[13px] outline-none">
      <select id="courseInput" class="w-full glass px-4 py-3 rounded-2xl text-[13px]">
        <option>BSIT-2A</option><option>BSCS-3B</option><option>BSIT-1A</option><option>BSCS-1A</option>
      </select>
    </div>
    <div class="flex gap-3 mt-8">
      <button onclick="closeModal()" class="flex-1 glass py-3 rounded-2xl font-bold text-[13px]">Cancel</button>
      <button id="saveBtn" onclick="saveStudent()" class="flex-1 bg-white text-black py-3 rounded-2xl font-bold text-[13px]">Save</button>
    </div>
  </div>
</div>

<script>
let editingRow = null;
const modal = document.getElementById('addModal');
const tableBody = document.querySelector('tbody');
const addBtn = document.querySelector('main button.bg-white');

// OPEN ADD
addBtn?.addEventListener('click', (e)=>{
  e.preventDefault();
  editingRow = null;
  document.getElementById('modalTitle').textContent = '+ Add New Student';
  document.getElementById('saveBtn').textContent = 'Save Student';
  document.getElementById('lrnInput').value = '';
  document.getElementById('nameInput').value = '';
  modal.classList.remove('hidden');
});

function closeModal(){ modal.classList.add('hidden'); editingRow = null; }

// SAVE - ADD OR EDIT
function saveStudent(){
  const lrn = document.getElementById('lrnInput').value || '12' + Math.floor(Math.random()*10000000000);
  const name = document.getElementById('nameInput').value.trim();
  const course = document.getElementById('courseInput').value;
  if(!name){ alert('Butangi ug name boss!'); return; }

  if(editingRow){
    // EDIT MODE
    editingRow.querySelector('td:first-child').textContent = lrn;
    editingRow.querySelector('td:nth-child(2)').innerHTML = `
      <div class="flex items-center gap-2">
        <div class="w-7 h-7 bg-gradient-to-br from-yellow-400 to-orange-500 rounded-full flex items-center justify-center text-[9px] font-bold">${name[0]}</div>
        ${name}
      </div>`;
    editingRow.querySelector('td:nth-child(3) span').textContent = course;
  } else {
    // ADD MODE
    const row = document.createElement('tr');
    row.className = 'hover:bg-white/[0.02]';
    row.innerHTML = `
      <td class="py-5 text-white/60">${lrn}</td>
      <td class="font-semibold flex items-center gap-2"><div class="w-7 h-7 bg-gradient-to-br from-blue-500 to-purple-600 rounded-full flex items-center justify-center text-[9px] font-bold">${name[0]}</div>${name}</td>
      <td><span class="glass px-3 py-1 rounded-full text-[11px]">${course}</span></td>
      <td><span class="bg-green-500/15 text-green-400 px-3 py-1 rounded-full text-[10px]">● Active</span></td>
      <td class="flex gap-2"><button class="edit-btn text-blue-400 px-2 py-1 rounded-lg hover:bg-blue-500/20">Edit</button><button class="del-btn text-red-400 px-2 py-1 rounded-lg hover:bg-red-500/20">Del</button></td>
    `;
    tableBody.prepend(row);
  }
  closeModal();
}

// EDIT & DELETE - DELEGATION - BISAN BAG-ONG ROW - MA TOUCH GIHAPON
tableBody?.addEventListener('click', (e)=>{
  const row = e.target.closest('tr');
  if(!row) return;

  if(e.target.classList.contains('edit-btn') || e.target.textContent === 'Edit'){
    editingRow = row;
    const lrn = row.cells[0].textContent;
    const name = row.cells[1].textContent.trim();
    const course = row.cells[2].textContent.trim();
    
    document.getElementById('modalTitle').textContent = '✏️ Edit Student';
    document.getElementById('saveBtn').textContent = 'Update';
    document.getElementById('lrnInput').value = lrn;
    document.getElementById('nameInput').value = name;
    // set course
    const sel = document.getElementById('courseInput');
    for(let o of sel.options){ if(o.text===course) o.selected=true; }
    
    modal.classList.remove('hidden');
  }

  if(e.target.classList.contains('del-btn') || e.target.textContent === 'Del'){
    if(confirm('Delete ni boss? '+row.cells[1].textContent+'?')){
      row.remove();
    }
  }
});

// CONVERT OLD EDIT BUTTONS TO WORKING
document.querySelectorAll('tbody button').forEach(b=>{
  if(b.textContent.trim()==='Edit'){ b.className='edit-btn text-blue-400 px-2 py-1 rounded-lg hover:bg-blue-500/20'; }
});

// CLOSE MODAL CLICK OUTSIDE
modal?.addEventListener('click', (e)=>{ if(e.target===modal) closeModal(); });

// SEARCH
document.querySelector('input[placeholder*="Search"]')?.addEventListener('input', e=>{
  const f = e.target.value.toLowerCase();
  document.querySelectorAll('tbody tr').forEach(r=>{ r.style.display = r.textContent.toLowerCase().includes(f) ? '' : 'none'; });
});
</script>

<style>
@media (max-width: 768px){ aside{display:none !important;} main{margin-left:0 !important; padding:16px !important;} }
button{ touch-action: manipulation; cursor:pointer; min-height:36px; }
</style>
</html>
